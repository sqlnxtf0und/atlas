[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-intel"
version = "0.1.0"
description = "ATLAS — Advanced Threat & Infrastructure Intelligence System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ATLAS Contributors" }]
keywords = ["security", "attack-surface", "osint", "infrastructure", "graph"]

dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.35",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "networkx>=3.4,<4",
  "typer>=0.19,<0.20",
  "click>=8.3.1,<9",
  "rich>=13.9,<14",
  "httpx>=0.27,<0.29",
  "dnspython>=2.7,<3",
  "cryptography>=43,<46",
  "jinja2>=3.1,<4",
  "pyyaml>=6.0,<7",
  "python-multipart>=0.0.12,<0.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=63,<66"]
neo4j = ["neo4j>=5.26,<6"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "respx>=0.21,<0.23",
  "freezegun>=1.5,<2",
  "mypy>=1.13,<2",
  "ruff>=0.8,<0.10",
  "types-PyYAML",
  "build>=1.2,<2",
]

[project.scripts]
atlas = "atlas.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["py.typed", "templates/*.html", "templates/**/*.html", "web/static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: touches a real database engine",
  "network: would touch the network (never enabled in CI)",
]

[tool.coverage.run]
source = ["atlas"]
branch = true
omit = ["*/migrations/*", "*/cli/commands/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "T20", "RUF"]
ignore = ["B008", "SIM108", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T20"]
"src/atlas/cli/*" = ["T20"]  # Typer/Rich own the terminal
"src/atlas/migrations/*" = ["E501"]  # autogenerated DDL is not hand-wrapped

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []
exclude = ["migrations/", "build/"]
